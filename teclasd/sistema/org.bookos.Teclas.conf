<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- Solo root publica el servicio. -->
  <policy user="root">
    <allow own="org.bookos.Teclas"/>
  </policy>

  <!-- Cualquiera puede llamar: lo que cambia algo lo filtra polkit dentro. -->
  <policy context="default">
    <allow send_destination="org.bookos.Teclas" send_interface="org.bookos.Teclas"/>
    <allow send_destination="org.bookos.Teclas" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.bookos.Teclas" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>

</busconfig>
